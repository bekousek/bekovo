<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#12100f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Boss Health Counter</title>
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Boss%20HP%22%2C%22short_name%22%3A%22Boss%20HP%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%2312100f%22%2C%22theme_color%22%3A%22%2312100f%22%2C%22start_url%22%3A%22.%22%7D">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#12100f; --panel:#1c1917; --line:#2e2825;
    --txt:#f5f0ec; --dim:#8b8178;
    --hp:#dc2626; --heal:#16a34a;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--txt);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
    touch-action:manipulation;
  }

  /* --- header --- */
  header{
    display:flex; align-items:center; gap:.5rem;
    padding:.7rem .8rem calc(.7rem) .8rem;
    padding-top:calc(.7rem + env(safe-area-inset-top,0px));
    border-bottom:1px solid var(--line);
  }
  #name{
    flex:1; background:none; border:none; color:var(--txt);
    font-size:1.05rem; font-weight:650; letter-spacing:-.01em;
    min-width:0; padding:.2rem 0;
  }
  #name:focus{outline:none;color:#fff}
  header button{
    background:var(--panel); border:1px solid var(--line); color:var(--dim);
    border-radius:.6rem; padding:.45rem .7rem; font-size:.78rem; font-weight:600;
    cursor:pointer;
  }
  header button:active{background:#262220}

  /* --- HP display --- */
  main{flex:1; display:flex; flex-direction:column; justify-content:center; padding:.5rem 1rem; min-height:0}
  #hp{
    font-variant-numeric:tabular-nums; font-weight:800;
    font-size:clamp(3.5rem,22vw,7rem); line-height:1; text-align:center;
    letter-spacing:-.04em; transition:color .12s;
  }
  #hp.dead{color:var(--hp)}
  #sub{text-align:center;color:var(--dim);font-size:.85rem;margin-top:.4rem;font-variant-numeric:tabular-nums}
  #bar{
    height:.55rem;border-radius:99px;background:#2a2422;overflow:hidden;
    margin:1rem auto 0;max-width:34rem;width:100%;
  }
  #fill{height:100%;background:linear-gradient(90deg,#b91c1c,#ef4444);width:100%;transition:width .18s ease}

  /* --- log --- */
  #log{
    max-width:34rem;width:100%;margin:.9rem auto 0;
    display:flex;gap:.35rem;flex-wrap:wrap;justify-content:center;
    font-size:.72rem;color:var(--dim);font-variant-numeric:tabular-nums;
    max-height:3.4rem;overflow:hidden;
  }
  #log span{background:var(--panel);border:1px solid var(--line);border-radius:.4rem;padding:.15rem .4rem}
  #log span.up{color:#4ade80}
  #log span.dn{color:#f87171}

  /* --- pad --- */
  #pad{
    display:grid; grid-template-columns:repeat(4,1fr); gap:.5rem;
    padding:.6rem .6rem calc(.6rem + var(--safe-b)) .6rem;
    border-top:1px solid var(--line);
  }
  .k{
    border:1px solid var(--line); background:var(--panel); color:var(--txt);
    border-radius:.9rem; font-size:1.15rem; font-weight:700;
    padding:.95rem .2rem; font-variant-numeric:tabular-nums;
    cursor:pointer; user-select:none; transition:transform .06s,background .1s;
  }
  .k:active{transform:scale(.94)}
  .k.dmg{background:#2a1414;border-color:#4c1d1d;color:#fca5a5}
  .k.dmg:active{background:#3b1a1a}
  .k.heal{background:#122a18;border-color:#1b4429;color:#86efac}
  .k.heal:active{background:#183a20}
  .row2{grid-column:span 4;display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
  .k.util{font-size:.85rem;font-weight:600;color:var(--dim);padding:.7rem .2rem}
  #custom{
    width:100%;background:var(--panel);border:1px solid var(--line);color:var(--txt);
    border-radius:.9rem;padding:.7rem;font-size:.95rem;text-align:center;
    font-variant-numeric:tabular-nums;
  }
  #custom:focus{outline:none;border-color:#4b4340}
</style>
</head>
<body>

<header>
  <input id="name" value="Boss" spellcheck="false" aria-label="Jméno bosse">
  <button id="setmax">Max HP</button>
  <button id="reset">Reset</button>
</header>

<main>
  <div id="hp">100</div>
  <div id="sub">z <span id="maxlbl">100</span></div>
  <div id="bar"><div id="fill"></div></div>
  <div id="log"></div>
</main>

<div id="pad">
  <button class="k dmg" data-d="-1">−1</button>
  <button class="k dmg" data-d="-5">−5</button>
  <button class="k dmg" data-d="-10">−10</button>
  <button class="k dmg" data-d="-25">−25</button>
  <button class="k heal" data-d="1">+1</button>
  <button class="k heal" data-d="5">+5</button>
  <button class="k heal" data-d="10">+10</button>
  <button class="k heal" data-d="25">+25</button>
  <div class="row2">
    <input id="custom" inputmode="numeric" placeholder="± vlastní" aria-label="Vlastní hodnota">
    <button class="k util" id="undo">↩ Zpět</button>
    <button class="k util" id="full">Doplnit</button>
  </div>
</div>

<script>
(function(){
  var KEY='bossHP.v1';
  var S={name:'Boss',hp:100,max:100,log:[]};
  try{var raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}

  var $=function(id){return document.getElementById(id)};
  var elHp=$('hp'),elSub=$('maxlbl'),elFill=$('fill'),elLog=$('log'),elName=$('name');

  function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

  function render(){
    elHp.textContent=S.hp;
    elHp.classList.toggle('dead',S.hp<=0);
    elSub.textContent=S.max;
    elName.value=S.name;
    var pct=S.max>0?Math.max(0,Math.min(100,S.hp/S.max*100)):0;
    elFill.style.width=pct+'%';
    elLog.innerHTML='';
    S.log.slice(-12).reverse().forEach(function(d){
      var s=document.createElement('span');
      s.className=d>0?'up':'dn';
      s.textContent=(d>0?'+':'')+d;
      elLog.appendChild(s);
    });
    document.title=S.name+' — '+S.hp+' HP';
  }

  function buzz(ms){if(navigator.vibrate)try{navigator.vibrate(ms)}catch(e){}}

  function apply(d){
    if(!d)return;
    S.hp+=d;
    S.log.push(d);
    if(S.log.length>50)S.log=S.log.slice(-50);
    save();render();
    buzz(d<0?12:8);
  }

  document.querySelectorAll('[data-d]').forEach(function(b){
    b.addEventListener('click',function(){apply(parseInt(b.dataset.d,10))});
  });

  $('undo').addEventListener('click',function(){
    var d=S.log.pop();
    if(d===undefined)return;
    S.hp-=d; save(); render(); buzz(20);
  });

  $('full').addEventListener('click',function(){
    S.hp=S.max; S.log=[]; save(); render();
  });

  $('reset').addEventListener('click',function(){
    if(!confirm('Resetovat na plné HP a smazat historii?'))return;
    S.hp=S.max; S.log=[]; save(); render();
  });

  $('setmax').addEventListener('click',function(){
    var v=prompt('Maximální HP:',S.max);
    if(v===null)return;
    var n=parseInt(v,10);
    if(isNaN(n)||n<=0)return;
    S.max=n; S.hp=n; S.log=[]; save(); render();
  });

  elName.addEventListener('input',function(){S.name=elName.value||'Boss';save();document.title=S.name+' — '+S.hp+' HP'});
  elName.addEventListener('blur',function(){if(!elName.value){S.name='Boss';render()}});

  var cu=$('custom');
  cu.addEventListener('keydown',function(e){
    if(e.key!=='Enter')return;
    e.preventDefault();
    var t=cu.value.trim();
    var n=parseInt(t,10);
    if(!isNaN(n)){
      // "5" bez znaménka = poškození
      apply(/^[+]/.test(t)?Math.abs(n):(/^-/.test(t)?n:-Math.abs(n)));
    }
    cu.value=''; cu.blur();
  });

  // klávesnice na desktopu
  document.addEventListener('keydown',function(e){
    if(document.activeElement&&/INPUT/.test(document.activeElement.tagName))return;
    if(e.key==='ArrowDown')apply(-1);
    else if(e.key==='ArrowUp')apply(1);
    else if(e.key==='PageDown')apply(-10);
    else if(e.key==='PageUp')apply(10);
    else if(e.key==='z')$('undo').click();
  });

  render();

  // offline cache
  if('serviceWorker' in navigator){
    var sw="var C='boss-v1';self.addEventListener('install',function(e){self.skipWaiting();e.waitUntil(caches.open(C).then(function(c){return c.addAll(['./','./index.html'])}))});self.addEventListener('activate',function(e){e.waitUntil(self.clients.claim())});self.addEventListener('fetch',function(e){if(e.request.method!=='GET')return;e.respondWith(caches.match(e.request).then(function(r){return r||fetch(e.request).then(function(n){var cl=n.clone();caches.open(C).then(function(c){c.put(e.request,cl)});return n}).catch(function(){return caches.match('./')})}))});";
    try{
      var url=URL.createObjectURL(new Blob([sw],{type:'text/javascript'}));
      navigator.serviceWorker.register(url,{scope:'./'}).catch(function(){});
    }catch(e){}
  }
})();
</script>
</body>
</html>
